<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des Étudiants</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th { background: #4a90e2; color: white; padding: 12px 16px; text-align: left; }
        td { padding: 12px 16px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f0f7ff; }
        #message { color: red; }
    </style>
</head>
<body>
<h1>Liste des Étudiants</h1>
<p id="message"></p>
<table id="tableau" style="display:none">
    <thead>
    <tr>
        <th>ID</th>
        <th>CIN</th>
        <th>Nom</th>
        <th>Date de naissance</th>
    </tr>
    </thead>
    <tbody id="corps"></tbody>
</table>

<script>
    fetch('/api/etudiants')
        .then(res => {
            if (!res.ok) throw new Error('Erreur réseau');
            return res.json();
        })
        .then(data => {
            const corps = document.getElementById('corps');
            const tableau = document.getElementById('tableau');

            if (data.length === 0) {
                document.getElementById('message').textContent = 'Aucun étudiant trouvé.';
                return;
            }

            data.forEach(e => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${e.id}</td>
                    <td>${e.cin}</td>
                    <td>${e.nom}</td>
                    <td>${e.dateNaissance}</td>
                `;
                corps.appendChild(tr);
            });

            tableau.style.display = 'table';
        })
        .catch(err => {
            document.getElementById('message').textContent = 'Erreur : ' + err.message;
        });
</script>
</body>
</html>
